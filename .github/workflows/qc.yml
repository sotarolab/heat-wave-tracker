name: QC

# The gates every pull request passes. docs/process/WORKFLOW.md lists them; the `pr` skill
# runs the same commands before a pull request is opened.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install test dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Types (modules written under the gate)
        run: mypy
      - name: Writing rules
        run: python scripts/check_phrases.py
      - name: Tests
        run: pytest -q

  client:
    # The client arrives with issue #35. Until then this job has nothing to build.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: has
        run: echo "client=$([ -f client/package.json ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        if: steps.has.outputs.client == 'yes'
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - name: Build and test
        if: steps.has.outputs.client == 'yes'
        working-directory: client
        run: |
          npm ci
          npm run build
          npx vitest run

  container:
    # The image Render builds, built and booted here first: a broken container fails the pull
    # request instead of the deploy.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t us-nowcast .
      - name: Boot and call the routes
        run: |
          docker run -d --name app -p 8051:8051 us-nowcast
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8051/healthz && break || sleep 2; done
          curl -fs http://127.0.0.1:8051/healthz | grep -q '"forecast":true'
          curl -fs http://127.0.0.1:8051/ | grep -q '<div id="root">'
          curl -fs http://127.0.0.1:8051/api/manifest | grep -q '"init"'
          curl -fs http://127.0.0.1:8051/api/stations | grep -q '"KDCA"'
          curl -fs -o field.png http://127.0.0.1:8051/api/field/t2m/0.png && file field.png | grep -q PNG
          # The station page must answer even when a feed outside is slow or refuses the runner.
          curl -fs http://127.0.0.1:8051/api/station/KDCA | grep -q '"headline"'
      - name: Container log
        if: always()
        run: docker logs app | tail -40
